<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Craftify app icon: white letter "C" on the brand teal background. -->
  <!-- The "C" is a single annular sector (270° ring, open 90° on the right), -->
  <!-- drawn as one white path so every edge is a single clean antialiased contour -->
  <!-- (no background-coloured "erase" overlay, which used to double the antialiasing). -->
  <!-- Geometry (viewBox 256, centre 128,128): outer R=96, inner r=54 → stroke width 42. -->
  <rect width="256" height="256" fill="#00C0B6"/>
  <path d="M195.882 195.882 A96 96 0 1 1 195.882 60.118 L166.184 89.816 A54 54 0 1 0 166.184 166.184 Z" fill="#FFFFFF"/>
</svg>
