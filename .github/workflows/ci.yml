name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      MINT_PATH: ${{ github.workspace }}/.mint
      DEVELOPER_DIR: /Applications/Xcode_15.2.app/Contents/Developer
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove corrupted Package.resolved file
        run: rm -f **/Package.resolved

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Set up Xcode
        run: sudo xcode-select -s "$DEVELOPER_DIR"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Install Mint
        run: brew install mint || true

      - name: Install tools via brew
        run: brew install xcodegen swiftlint swiftformat xcbeautify || true

      - name: Ensure run script is executable
        run: chmod +x ./run

      - name: Run all tests (lint, format, unit, E2E)
        run: ./run test

      - name: Collect code coverage
        run: |
          mkdir -p coverage
          xcrun xccov view --report --json $(find ~/Library/Developer/Xcode/DerivedData -name '*.xcresult' | sort | tail -n1) > coverage/coverage.json
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Check code coverage threshold
        run: |
          COVERAGE=$(jq '.targets | to_entries[] | select(.key | test("CraftifyShared")) | .value.lineCoverage' coverage/coverage.json | head -n1)
          echo "Coverage: $COVERAGE"
          if (( $(echo "$COVERAGE < 0.80" | bc -l) )); then
            echo "::error ::Code coverage below 80% ($COVERAGE)"
            exit 1
          fi
        shell: bash
        continue-on-error: false

      - name: Check ShareExtension size
        run: ./run check-size
        shell: bash
        continue-on-error: false

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/