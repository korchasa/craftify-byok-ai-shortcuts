name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      MINT_PATH: ${{ github.workspace }}/.mint
      DEVELOPER_DIR: /Applications/Xcode_15.2.app/Contents/Developer
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Set up Xcode
        run: sudo xcode-select -s "$DEVELOPER_DIR"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Install tools
        run: |
          brew install xcodegen swiftlint swiftformat xcbeautify || true

      - name: Show tool versions
        run: |
          xcodegen --version
          swiftlint --version
          swiftformat --version
          xcbeautify --version

      - name: Format (SwiftFormat)
        run: swiftformat . --lint

      - name: Lint (SwiftLint)
        run: swiftlint --strict

      - name: Generate Xcode project
        run: xcodegen

      - name: Build MainApp
        run: xcodebuild -scheme MainApp -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14,OS=16.4' build

      - name: Build ShareExtension
        run: xcodebuild -scheme ShareExtension -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14,OS=16.4' build

      - name: Build CraftifyShared
        run: xcodebuild -scheme CraftifyShared -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14,OS=16.4' build

      - name: Test CraftifyShared
        run: xcodebuild -scheme CraftifyShared -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14,OS=16.4' test

      - name: Archive ShareExtension (Release)
        run: xcodebuild -scheme ShareExtension -sdk iphoneos -configuration Release -archivePath $PWD/build/ShareExtension.xcarchive archive

      - name: Collect code coverage
        run: |
          mkdir -p coverage
          xcrun xccov view --report --json $(find ~/Library/Developer/Xcode/DerivedData -name '*.xcresult' | sort | tail -n1) > coverage/coverage.json
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/

      - name: Check code coverage threshold
        run: |
          COVERAGE=$(jq '.targets | to_entries[] | select(.key | test("CraftifyShared")) | .value.lineCoverage' coverage/coverage.json | head -n1)
          echo "Coverage: $COVERAGE"
          if (( $(echo "$COVERAGE < 0.80" | bc -l) )); then
            echo "::error ::Code coverage below 80% ($COVERAGE)"
            exit 1
          fi
        shell: bash
        continue-on-error: false

      - name: Check ShareExtension size
        run: |
          EXT_PATH=$(find $PWD/build/ShareExtension.xcarchive/Products/ -name 'ShareExtension.appex' | head -n1)
          SIZE=$(du -m "$EXT_PATH" | cut -f1)
          echo "ShareExtension size: ${SIZE}MB"
          if [ "$SIZE" -gt 20 ]; then
            echo "::error ::ShareExtension size exceeds 20MB!"
            exit 1
          fi
        shell: bash
        continue-on-error: false