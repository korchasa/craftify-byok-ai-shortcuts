name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      MINT_PATH: ${{ github.workspace }}/.mint
      DEVELOPER_DIR: /Applications/Xcode_15.2.app/Contents/Developer
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove corrupted Package.resolved file
        run: rm -f **/Package.resolved

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Set up Xcode
        run: sudo xcode-select -s "$DEVELOPER_DIR"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Install Mint
        run: brew install mint || true

      - name: Install tools via brew
        run: brew install xcodegen swiftlint swiftformat xcbeautify || true

      - name: Lint (SwiftLint)
        run: swiftlint --strict

      - name: Format (SwiftFormat)
        run: swiftformat . --lint --swiftversion 5.9

      - name: Ensure generated directories exist
        run: |
          mkdir -p src/MainApp/Resources/Generated
          mkdir -p src/CraftifyShared/Generated

      - name: Generate localized strings (SwiftGen)
        run: mint run swiftgen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build MainApp
        run: xcodebuild -scheme MainApp -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14,OS=16.4' build | xcbeautify

      - name: Unit tests MainApp
        run: xcodebuild -scheme MainAppUnitTests -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14,OS=16.4' test | xcbeautify

      - name: Unit tests ShareExtension
        run: xcodebuild -scheme ShareExtensionUnitTests -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14,OS=16.4' test | xcbeautify

      - name: Unit tests CraftifyShared
        run: xcodebuild -scheme CraftifySharedUnitTests -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14,OS=16.4' test | xcbeautify

      - name: E2E tests MainApp
        run: xcodebuild -scheme MainAppE2ETests -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14,OS=16.4' test | xcbeautify

      - name: E2E tests ShareExtension
        run: xcodebuild -scheme ShareExtensionE2ETests -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14,OS=16.4' test | xcbeautify

      - name: E2E tests CraftifyShared
        run: xcodebuild -scheme CraftifySharedE2ETests -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14,OS=16.4' test | xcbeautify

      - name: Check ShareExtension size
        run: |
          mint run xcodegen
          rm -rf build
          xcodebuild build \
            -scheme ShareExtension \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            BUILD_DIR=build/Products | mint run xcbeautify
          EXT_PATH="build/Products/Release-iphoneos/ShareExtension.appex"
          if [ ! -d "$EXT_PATH" ]; then
            echo "::error ::No .appex found at $EXT_PATH"
            exit 1
          fi
          SIZE_KB=$(du -sk "$EXT_PATH" | awk '{print $1}')
          SIZE_MB=$(( (SIZE_KB + 1023) / 1024 ))
          echo "ShareExtension size: ${SIZE_MB} MB"
          if (( SIZE_MB > 20 )); then
            echo "::error ::ShareExtension size exceeds 20MB!"
            exit 1
          fi
        shell: bash
        continue-on-error: false

      - name: Collect code coverage
        run: |
          mkdir -p coverage
          xcrun xccov view --report --json $(find ~/Library/Developer/Xcode/DerivedData -name '*.xcresult' | sort | tail -n1) > coverage/coverage.json
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Check code coverage threshold
        run: |
          COVERAGE=$(jq '.targets | to_entries[] | select(.key | test("CraftifyShared")) | .value.lineCoverage' coverage/coverage.json | head -n1)
          echo "Coverage: $COVERAGE"
          if (( $(echo "$COVERAGE < 0.80" | bc -l) )); then
            echo "::error ::Code coverage below 80% ($COVERAGE)"
            exit 1
          fi
        shell: bash
        continue-on-error: false

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/