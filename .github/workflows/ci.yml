name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/*'
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    branches:
      - main
      - master
      - develop
      - 'feature/*'
      - 'release/*'
      - 'hotfix/*'

jobs:
  setup:
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove corrupted Package.resolved file
        run: rm -f **/Package.resolved

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Install tools via brew
        run: brew install xcodegen swiftlint swiftformat xcbeautify swiftgen || true

  feature:
    needs: setup
    runs-on: macos-latest
    if: >-
      startsWith(github.ref, 'refs/heads/feature/') ||
      startsWith(github.head_ref, 'feature/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Lint (SwiftLint)
        run: ./run lint
      - name: Format (SwiftFormat)
        run: ./run fmt
      - name: Build (simulator)
        run: ./run build
      - name: Unit tests
        run: ./run test:unit
      - name: Coverage
        run: ./run test:coverage
      - name: PR checks
        run: ./run pr-check

  develop:
    needs: setup
    runs-on: macos-latest
    if: github.ref == 'refs/heads/develop' || github.head_ref == 'develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Static analysis
        run: ./run analyze
      - name: Archive build
        run: ./run archive
      - name: Unit & UI tests
        run: ./run test
      - name: Coverage
        run: ./run test:coverage
      - name: Internal TestFlight deploy
        run: ./run deploy:internal

  release:
    needs: setup
    runs-on: macos-latest
    if: >-
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.head_ref, 'release/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Version bump
        run: ./run bump-version
      - name: Release archive build
        run: ./run archive
      - name: Integration tests
        run: ./run test:e2e
      - name: IPA artifact
        run: ./run export-ipa
      - name: TestFlight beta deploy
        run: ./run deploy:testflight
      - name: Changelog generation
        run: ./run generate-changelog
      - name: Notifications
        run: ./run notify

  hotfix:
    needs: setup
    runs-on: macos-latest
    if: >-
      startsWith(github.ref, 'refs/heads/hotfix/') ||
      startsWith(github.head_ref, 'hotfix/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Emergency build
        run: ./run build
      - name: Minimal test suite
        run: ./run test:unit
      - name: Ad-hoc IPA export
        run: ./run export-ipa
      - name: TestFlight/Ad-hoc distribution
        run: ./run deploy:adhoc
      - name: Changelog update
        run: ./run generate-changelog

  main:
    needs: setup
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.head_ref == 'main' || github.head_ref == 'master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Release build
        run: ./run build
      - name: Full test suite
        run: ./run test
      - name: Archive for dSYMs
        run: ./run archive
      - name: Collect dSYMs
        run: ./run collect-dsyms
      - name: App Store Connect upload
        run: ./run deploy:appstore
      - name: Monitoring setup
        run: ./run monitor-setup
      - name: Notifications
        run: ./run notify