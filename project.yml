name: Craftify
options:
  bundleIdPrefix: dev.korchasa
  deploymentTarget:
    iOS: 16.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: 78M3ZDR5UH
    SWIFT_VERSION: 5.9
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    SWIFT_OPTIMIZATION_LEVEL: '-Onone'
    CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  debug:
    OTHER_LDFLAGS: "$(inherited) -ObjC"
  release:
    OTHER_LDFLAGS: "$(inherited) -dead_strip -ObjC"
    SWIFT_OPTIMIZATION_LEVEL: '-O'
targets:
  MainApp:
    type: application
    platform: iOS
    sources:
      - path: src/MainApp/Sources/Components
      - path: src/MainApp/Sources/CraftifyApp.swift
      - path: src/MainApp/Sources/EditOperationView.swift
      - path: src/MainApp/Sources/AddOperationView.swift
      - path: src/MainApp/Sources/SettingsView.swift
      - path: src/MainApp/Sources/FormStyleConstants.swift
      - path: src/MainApp/Sources/HomeView.swift
      - path: src/MainApp/Sources/HowToUseView.swift
      - path: src/MainApp/Sources/CraftifySecondaryButtonStyle.swift
      - path: src/MainApp/Sources/SettingsViewConstants.swift
      - path: src/MainApp/Sources/MainAppButtonConstants.swift
      - path: src/MainApp/Sources/AddOperationViewConstants.swift
      - path: src/MainApp/Sources/AddOperationViewModel.swift
      - path: src/MainApp/Sources/EditOperationViewModel.swift
      - path: src/MainApp/Sources/Font+Craftify.swift
      - path: src/MainApp/Sources/SettingsViewModel.swift
      - path: src/MainApp/Sources/SettingsView_Previews.swift
      - path: src/MainApp/Sources/AddOperationView_Previews.swift
      - path: src/MainApp/Sources/EditOperationView_Previews.swift
      - path: src/MainApp/Sources/AuthManagerMock.swift
      - path: src/MainApp/Sources/HomeViewModel.swift
      - path: src/MainApp/Sources/AppState.swift
      - path: src/MainApp/Sources/HowToUseViewModel.swift
      - path: src/MainApp/Sources/MainAppPlaceholder.swift
      - path: src/Common/Generated/Strings.swift
      - path: src/Common/Sources/ColorPaletteConstants.swift
    resources:
      - path: src/MainApp/Resources
        excludes:
          - Generated/Strings.swift
    appIcon: AppIcon
    info:
      path: src/MainApp/Config/Info.plist
      properties:
        CFBundleDisplayName: Craftify
        CFBundleIconName: AppIcon
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
    entitlements:
      path: src/MainApp/Config/Craftify.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.korchasa.Craftify
        keychain-access-groups:
          - 78M3ZDR5UH.group.dev.korchasa.Craftify
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: dev.korchasa.Craftify
        APP_GROUPS: group.dev.korchasa.Craftify
        KEYCHAIN_ACCESS_GROUPS: 78M3ZDR5UH.*
        PROVISIONING_PROFILE_SPECIFIER: "Craftify MainApp"
    dependencies:
      - target: Common
      - target: ShareExtension
    embedAppExtensions:
      - ShareExtension
  MainAppUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: src/MainApp/UnitTests
      - path: src/MainApp/Sources
      - path: src/Common/Generated/Strings.swift
    dependencies:
      - target: MainApp
      - target: Common
      - package: CwlPreconditionTesting
      - package: CwlCatchException
      - package: ViewInspector
      - sdk: XCTest.framework
    testTarget: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTING_SEARCH_PATHS: YES
        SDKROOT: iphonesimulator
        OTHER_LDFLAGS:
          - "-weak_framework"
          - "XCTest"
          - "-weak-lXCTestSwiftSupport"
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: src/ShareExtension/Sources/ShareExtensionManager.swift
      - path: src/ShareExtension/Sources/ShareExtensionView.swift
      - path: src/ShareExtension/Sources/ShareExtensionButtonConstants.swift
      - path: src/ShareExtension/Sources/ShareExtensionPrimaryButtonStyle.swift
      - path: src/ShareExtension/Sources/Font+Craftify.swift
      - path: src/ShareExtension/Sources/ShareExtensionViewConstants.swift
      - path: src/ShareExtension/Sources/BottomSheetContainerView.swift
      - path: src/ShareExtension/Sources/ProcessingManager.swift
      - path: src/ShareExtension/Sources/ShareExtensionViewModel.swift
      - path: src/ShareExtension/Sources/ShareExtensionViewController.swift
      - path: src/ShareExtension/Sources/ContentHeightKey.swift
      - path: src/ShareExtension/Sources/ShareExtensionViewModelConstants.swift
      - path: src/ShareExtension/Sources/ClipboardManagerStub.swift
      - path: src/ShareExtension/Sources/LLMAPIClientError.swift
      - path: src/ShareExtension/Sources/ClipboardManager.swift
      - path: src/ShareExtension/Sources/LLMAPIClient.swift
      - path: src/ShareExtension/Sources/ProcessingManaging.swift
      - path: src/ShareExtension/Sources/ProcessingManagerStub.swift
      - path: src/ShareExtension/Sources/RoundedCorner.swift
      - path: src/ShareExtension/Sources/ShareExtensionViewHeight.swift
      - path: src/ShareExtension/Sources/ClipboardManaging.swift
      - path: src/ShareExtension/Sources/ShareExtensionPlaceholder.swift
      - path: src/Common/Generated/Strings.swift
    resources:
      - path: src/ShareExtension/Resources
      - path: src/ShareExtension/Resources/Assets.xcassets
      - path: src/Common/Resources/en.lproj
      - path: src/Common/Resources/ru.lproj
    appIcon: AppIcon
    info:
      path: src/ShareExtension/Config/Info.plist
      properties:
        CFBundleIconName: AppIcon
        CFBundleDisplayName: Craftify Share
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionAttributes:
            NSExtensionActivationRule: |
              SUBQUERY (
                extensionItems,
                $extensionItem,
                SUBQUERY (
                  $extensionItem.attachments,
                  $attachment,
                  ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text" ||
                  ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
                ).@count > 0
              ).@count > 0
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareExtensionViewController
    dependencies:
      - target: Common
    entitlements:
      path: src/ShareExtension/Config/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.korchasa.Craftify
        keychain-access-groups:
          - 78M3ZDR5UH.group.dev.korchasa.Craftify
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: dev.korchasa.Craftify.ShareExtension
        APP_GROUPS: group.dev.korchasa.Craftify
        KEYCHAIN_ACCESS_GROUPS: 78M3ZDR5UH.*
        PROVISIONING_PROFILE_SPECIFIER: "Craftify Share Extension"
        ENABLE_TESTING_SEARCH_PATHS: NO
  ShareExtensionUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: src/ShareExtension/UnitTests
      - path: src/ShareExtension/Sources
      - path: src/Common/Generated/Strings.swift
    dependencies:
      - target: ShareExtension
      - package: CwlPreconditionTesting
      - package: CwlCatchException
      - package: ViewInspector
    testTarget: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTING_SEARCH_PATHS: YES
        SDKROOT: iphonesimulator
        OTHER_LDFLAGS:
          - "-weak_framework"
          - "XCTest"
          - "-weak-lXCTestSwiftSupport"
  Common:
    type: framework
    platform: iOS
    sources:
      - path: src/Common/Sources
      - path: src/Common/Generated/Strings.swift
    info:
      path: src/Common/Config/Info.plist
    settings:
      base:
        ENABLE_MODULE_VERIFIER: YES
        MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu11 gnu++14"
        DYLIB_COMPATIBILITY_VERSION: 1
        DYLIB_CURRENT_VERSION: 1
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        INSTALL_PATH: "$(LOCAL_LIBRARY_DIR)/Frameworks"
        SKIP_INSTALL: YES
        VERSIONING_SYSTEM: "apple-generic"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ENABLE_STRICT_OBJC_MSGSEND: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        GCC_NO_COMMON_BLOCKS: YES
        MTL_FAST_MATH: YES
        ENABLE_TESTABILITY: YES
        SDKROOT: iphoneos
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: dev.korchasa.Common
        INFOPLIST_FILE: src/Common/Config/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        SWIFT_VERSION: 5.9
      debug:
        GCC_DYNAMIC_NO_PIC: NO
        SWIFT_OPTIMIZATION_LEVEL: '-Onone'
      release:
        SWIFT_OPTIMIZATION_LEVEL: '-O'
    dependencies:
      - package: SwiftSoup
    build:
      targets:
        Common: all
  CommonUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: src/Common/UnitTests
      - path: src/Common/Sources
    dependencies:
      - target: Common
      - package: CwlPreconditionTesting
      - package: CwlCatchException
      - sdk: XCTest.framework
    testTarget: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTING_SEARCH_PATHS: YES
        SDKROOT: iphonesimulator
        OTHER_LDFLAGS:
          - "-weak_framework"
          - "XCTest"
          - "-weak-lXCTestSwiftSupport"
packages:
  CwlPreconditionTesting:
    url: https://github.com/mattgallagher/CwlPreconditionTesting.git
    from: 2.2.2
  CwlCatchException:
    url: https://github.com/mattgallagher/CwlCatchException.git
    from: 2.2.1
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.4.3
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector.git
    from: 0.9.0

schemes:
  AllTests:
    build:
      targets:
        MainApp: all
        ShareExtension: all
        Common: all
    test:
      targets:
        - name: MainAppUnitTests
        - name: ShareExtensionUnitTests
        - name: CommonUnitTests
  MainApp:
    build:
      targets:
        MainApp: all
        ShareExtension: all
  ShareExtension:
    build:
      targets:
        ShareExtension: all
  ShareExtensionSizeReport:
    build:
      targets:
        ShareExtension: all
    run:
      config: Release
configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig