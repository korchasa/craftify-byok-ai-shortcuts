name: Craftify
options:
  bundleIdPrefix: dev.korchasa
  deploymentTarget:
    iOS: 16.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: 78M3ZDR5UH
    SWIFT_VERSION: 5.9
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    ENABLE_BITCODE: NO
    SWIFT_OPTIMIZATION_LEVEL: '-Onone'
    CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
  debug:
    OTHER_LDFLAGS: "$(inherited) -ObjC"
  release:
    OTHER_LDFLAGS: "$(inherited) -dead_strip -ObjC"
targets:
  MainApp:
    type: application
    platform: iOS
    sources:
      - path: src/MainApp/Sources
      - path: src/MainApp/Resources/Generated/Strings.swift
    resources:
      - path: src/MainApp/Resources
        excludes:
          - Generated/Strings.swift
    info:
      path: src/MainApp/Config/Info.plist
    entitlements:
      path: src/MainApp/Config/Craftify.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.korchasa.Craftify
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.korchasa.Craftify
        APP_GROUPS: group.dev.korchasa.Craftify
        KEYCHAIN_ACCESS_GROUPS: group.dev.korchasa.Craftify
    dependencies:
      - target: Common
      - package: NewRelic
  MainAppUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: src/MainApp/UnitTests
      - path: src/MainApp/Sources
      - path: src/MainApp/Resources/Generated/Strings.swift
    dependencies:
      - target: MainApp
      - package: Nimble
      - package: CwlPreconditionTesting
      - package: CwlCatchException
    testTarget: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MainAppE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: src/MainApp/E2ETests
      - path: src/MainApp/Sources
      - path: src/MainApp/Resources/Generated/Strings.swift
    dependencies:
      - target: MainApp
      - package: Nimble
      - package: CwlPreconditionTesting
      - package: CwlCatchException
    testTarget: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: src/ShareExtension/Sources
      - path: src/Common/Generated/Strings.swift
    resources:
      - path: src/ShareExtension/Resources
    info:
      path: src/ShareExtension/Config/Info.plist
    dependencies:
      - target: Common
    entitlements:
      path: src/ShareExtension/Config/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.korchasa.Craftify
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.korchasa.Craftify.ShareExtension
        APP_GROUPS: group.dev.korchasa.Craftify
        KEYCHAIN_ACCESS_GROUPS: group.dev.korchasa.Craftify
        CODE_SIGN_IDENTITY: "Apple Development: korchasa@icloud.com (2P55B82U54)"
        PROVISIONING_PROFILE_SPECIFIER: "09d74528-408d-43f1-96bd-259a04739802"
        DEVELOPMENT_TEAM: 78M3ZDR5UH
  ShareExtensionUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: src/ShareExtension/UnitTests
      - path: src/ShareExtension/Sources
      - path: src/Common/Generated/Strings.swift
    dependencies:
      - target: ShareExtension
      - package: Nimble
      - package: CwlPreconditionTesting
      - package: CwlCatchException
    testTarget: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ShareExtensionE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: src/ShareExtension/E2ETests
      - path: src/ShareExtension/Sources
      - path: src/Common/Generated/Strings.swift
    dependencies:
      - target: ShareExtension
      - package: Nimble
      - package: CwlPreconditionTesting
      - package: CwlCatchException
    testTarget: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  Common:
    type: framework
    platform: iOS
    sources:
      - path: src/Common/Sources
      - path: src/Common/Generated/Strings.swift
    resources: []
    info:
      path: src/Common/Config/Info.plist
    settings:
      base:
        ENABLE_TESTABILITY: YES
  CommonUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: src/Common/UnitTests
      - path: src/Common/Sources
    dependencies:
      - target: Common
      - package: Nimble
      - package: CwlPreconditionTesting
      - package: CwlCatchException
    testTarget: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CommonE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: src/Common/E2ETests
      - path: src/Common/Sources
    dependencies:
      - target: Common
      - package: Nimble
      - package: CwlPreconditionTesting
      - package: CwlCatchException
    testTarget: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
packages:
  Nimble:
    url: https://github.com/Quick/Nimble.git
    from: 12.0.0
  CwlPreconditionTesting:
    url: https://github.com/mattgallagher/CwlPreconditionTesting.git
    from: 2.2.2
  CwlCatchException:
    url: https://github.com/mattgallagher/CwlCatchException.git
    from: 2.2.1
  NewRelic:
    url: https://github.com/newrelic/newrelic-ios-agent-spm
    from: 7.5.5
schemes:
  MainApp:
    build:
      targets:
        MainApp: all
  MainAppUnitTests:
    build:
      targets:
        MainApp: all
    test:
      targets:
        - name: MainAppUnitTests
  MainAppE2ETests:
    build:
      targets:
        MainApp: all
    test:
      targets:
        - name: MainAppE2ETests
  ShareExtension:
    build:
      targets:
        ShareExtension: all
  ShareExtensionUnitTests:
    build:
      targets:
        ShareExtension: all
    test:
      targets:
        - name: ShareExtensionUnitTests
  ShareExtensionE2ETests:
    build:
      targets:
        ShareExtension: all
    test:
      targets:
        - name: ShareExtensionE2ETests
  CommonUnitTests:
    build:
      targets:
        Common: all
    test:
      targets:
        - name: CommonUnitTests
  CommonE2ETests:
    build:
      targets:
        Common: all
    test:
      targets:
        - name: CommonE2ETests
  ShareExtensionSizeReport:
    build:
      targets:
        ShareExtension: all
    run:
      config: Release
configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig